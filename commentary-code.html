<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commentary — Reo (Leo) Ishii</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          serif: ['"Source Serif 4"', 'Georgia', 'Cambria', 'serif'],
        },
        colors: {
          accent: '#181B39',
          accentSoft: '#6B73C7',
          ink: '#c9c9c9',
          canvas: '#1d1f20',
        },
      },
    },
  };
</script>
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    if (stored === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body class="bg-white dark:bg-canvas text-zinc-700 dark:text-ink font-serif antialiased transition-colors duration-200">

  <div class="max-w-[749px] mx-auto px-6 py-14">

    <!-- Header -->
    <header class="border-b border-zinc-200 dark:border-zinc-800 pb-6">
      <div class="flex items-start justify-between">
        <a href="index.html" class="flex items-center gap-5">
          <img src="logo.png" alt="Reo Ishii logo" class="w-32 h-32 rounded-full object-cover flex-shrink-0" />
          <div>
            <h1 class="text-3xl font-bold text-zinc-900 dark:text-white">Reo (Leo) Ishii</h1>
            <p class="text-base text-zinc-500 dark:text-slate-400 italic mt-1">IMF · Sophia University · Tokyo</p>
          </div>
        </a>
        <button id="theme-toggle" aria-label="Toggle theme" class="p-2 rounded-full border border-zinc-300 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-accent dark:hover:text-accentSoft hover:border-accent dark:hover:border-accentSoft transition-colors">
          <svg id="icon-moon" class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg id="icon-sun" class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.02 0l-.7.7M6.34 17.66l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
      </div>
      <nav class="mt-6 flex flex-wrap gap-2 text-base">
        <a href="index.html#home" class="px-4 py-2 rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 hover:text-accent dark:hover:text-accentSoft transition-colors">Home</a>
        <a href="index.html#research" class="px-4 py-2 rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 hover:text-accent dark:hover:text-accentSoft transition-colors">Research</a>
        <a href="commentary.html" class="px-4 py-2 rounded-full bg-accent/10 text-accent dark:bg-accentSoft/10 dark:text-accentSoft font-medium">Commentary</a>
        <a href="index.html#contact" class="px-4 py-2 rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 hover:text-accent dark:hover:text-accentSoft transition-colors">Contact</a>
      </nav>
    </header>

    <!-- Code -->
    <main class="mt-8">
      <a id="back-link" href="commentary.html" class="text-sm text-accent dark:text-accentSoft hover:underline">← Back to post</a>
      <div id="code-content" class="mt-6"></div>
    </main>

    <!-- Footer -->
    <footer class="mt-[72px] pt-6 border-t border-zinc-200 dark:border-zinc-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-zinc-400 dark:text-slate-500">
      <span>© <span id="year"></span> Reo Ishii</span>
      <nav class="space-x-2">
        <a href="index.html#home" class="hover:text-accent dark:hover:text-accentSoft">Home</a>
        <span>|</span>
        <a href="index.html#interests" class="hover:text-accent dark:hover:text-accentSoft">Interests</a>
        <span>|</span>
        <a href="index.html#education" class="hover:text-accent dark:hover:text-accentSoft">Education</a>
        <span>|</span>
        <a href="index.html#experience" class="hover:text-accent dark:hover:text-accentSoft">Experience</a>
        <span>|</span>
        <a href="index.html#research" class="hover:text-accent dark:hover:text-accentSoft">Research</a>
        <span>|</span>
        <a href="commentary.html" class="hover:text-accent dark:hover:text-accentSoft">Commentary</a>
        <span>|</span>
        <a href="index.html#contact" class="hover:text-accent dark:hover:text-accentSoft">Contact</a>
      </nav>
    </footer>

  </div>

  <script src="commentary-data.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderCode() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const entry = COMMENTARY.find((e) => e.slug === slug);
      const container = document.getElementById('code-content');
      const backLink = document.getElementById('back-link');

      if (!entry || !entry.code) {
        container.innerHTML = '<p class="text-sm text-zinc-500 dark:text-slate-400 italic">Code not found. <a href="commentary.html" class="text-accent dark:text-accentSoft hover:underline">Back to all commentary</a></p>';
        return;
      }

      backLink.href = 'commentary-post.html?slug=' + encodeURIComponent(entry.slug);
      const label = entry.codeLabel || 'Analysis code';
      document.title = label + ' — ' + entry.title + ' — Reo (Leo) Ishii';

      container.innerHTML = `
        <h2 class="text-3xl font-bold text-zinc-900 dark:text-white">${escapeHtml(label)}</h2>
        <p class="text-sm text-zinc-500 dark:text-slate-400 mt-2">From “${escapeHtml(entry.title)}”</p>
        <div class="mt-8 relative">
          <button id="copy-btn" class="absolute top-3 right-3 text-xs px-3 py-1.5 rounded-full border border-zinc-300 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-accent dark:hover:text-accentSoft hover:border-accent dark:hover:border-accentSoft transition-colors bg-white dark:bg-canvas">Copy</button>
          <pre class="overflow-x-auto rounded-md border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/60 p-5 text-sm leading-relaxed"><code id="code-text">${escapeHtml(entry.code)}</code></pre>
        </div>
      `;

      document.getElementById('copy-btn').addEventListener('click', function () {
        navigator.clipboard.writeText(entry.code).then(function () {
          const btn = document.getElementById('copy-btn');
          const original = btn.textContent;
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = original; }, 1500);
        });
      });
    }

    renderCode();

    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var root = document.documentElement;
      var isDark = root.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>

</body>
</html>
